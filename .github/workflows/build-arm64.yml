name: Build Android arm64-v8a

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.1"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build arm64-v8a debug APK
        run: >-
          ./gradlew :app:assembleDebug
          -PtargetAbi=arm64-v8a
          -PexcludeFrpclib=true
          -PisNeedPackage=false
          --no-daemon

      - name: Verify APK ABI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name "*arm64-v8a*.apk" -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/"
          if unzip -l "$apk" | grep -qE "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "APK contains an unexpected ABI" >&2
            exit 1
          fi
          echo "Verified: $apk"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-arm64-v8a-debug
          path: app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error

